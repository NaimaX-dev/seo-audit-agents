{% extends "base.html" %}
{% block title %}Not found - SEO Audit Agents{% endblock %}
{% block content %}
<div class="error-page">
  <div class="panel">
    <div class="empty-state">
      <div class="empty-icon"><i class="bi bi-signpost-split"></i></div>
      <span class="error-code">404</span>
      <h3>Page not found</h3>
      <p>{{ message or "The page you're looking for doesn't exist or has moved." }}</p>
      <div class="btn-row">
        <a href="{{ url_for('dashboard.home') }}" class="btn btn-brand"><i class="bi bi-grid-1x2-fill"></i>Back to dashboard</a>
        <a href="{{ url_for('dashboard.history') }}" class="btn btn-outline-brand"><i class="bi bi-clock-history"></i>View history</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
